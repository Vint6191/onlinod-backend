name: Conversation stores
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated fixture databases
        env: {PGPASSWORD: fixture-only}
        run: |
          createdb --host 127.0.0.1 --username postgres onlinod_test_dialogs180
          createdb --host 127.0.0.1 --username postgres onlinod_test_crm180
      - run: npm run audit:conversation
        env:
          ONLINOD_DIALOGS_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/onlinod_test_dialogs180
          ONLINOD_CRM_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/onlinod_test_crm180
